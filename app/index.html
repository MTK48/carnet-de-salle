<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fonte</title>
<meta name="description" content="Ta semaine de salle, tes séances, ta progression et ton corps.">
<meta name="theme-color" content="#0A1024">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fonte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : carnet d'une colonne pour téléphone. La semaine d'abord, barre d'onglets en bas, écrans plein format pour composer et suivre une séance, tiroir du bas pour choisir.
   Couleur : un bleu nuit profond, une lueur froide en haut de l'écran, un bleu glacier pour l'action, les disques de fonte colorés pour les muscles. */
:root{
  --bg:#0A1024; --bg-glow:#17275A; --surface:#111A33; --surface-2:#18233F; --surface-3:#1F2C50; --line:#24335A; --knurl:#2B3B66;
  --ink:#EAF0FF; --muted:#93A0C4; --primary:#7CC4FF; --primary-2:#B5DEFF; --on-primary:#071022; --on-ink:#071022;
  --scrim:rgba(3,7,20,.66); --ok:#46D39A; --danger:#FF8F8F; --amber:#FFB86B; --amber-soft:rgba(255,184,107,.14);
  --c1:#3D93E8; --c2:#C97A2A;
  --p-red:#E5554C; --p-blue:#5B80F2; --p-yellow:#EDBE34; --p-green:#3CB673; --p-white:#F1F3F5; --p-black:#05070A; --p-silver:#AEB7C1; --p-violet:#B07AD6;
  --font-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:18px; --r-sm:12px;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 55% at 50% -8%,var(--bg-glow) 0%,transparent 62%),radial-gradient(70% 40% at 100% 105%,rgba(61,147,232,.10) 0%,transparent 70%)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--font-mono);font-size:11.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 4px}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.top-date{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
main.wrap{padding-block:4px calc(96px + env(safe-area-inset-bottom,0px))}

/* Bandeaux */
.banner{margin:6px 0 12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface-2);font-size:14px}
.banner.warn{background:var(--surface);border:1px solid var(--danger)}
.banner.run{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--primary);color:var(--on-primary)}
.banner.run div{display:grid;gap:1px;min-width:0}
.banner.run span{font-size:13px;opacity:.85}
.banner.run .btn.primary{background:var(--on-ink);color:var(--ink)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:650;font-size:16px;border:1px solid transparent;white-space:nowrap}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn.grow{flex:1 1 auto}
.btn.block{width:100%}
.btn:disabled{opacity:.42;cursor:default}
.btn-dashed{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:1.5px dashed var(--line);border-radius:var(--r);font-weight:650;margin-block:14px}
.btn-dashed.sm{min-height:44px;margin-block:10px 0;font-size:15px}
.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.mini{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.mini:disabled{opacity:.3;cursor:default}
.link-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;min-height:36px;font-size:14px;font-weight:600;color:var(--muted)}

/* Disques de fonte : la couleur du groupe musculaire */
.disc{--c:var(--p-silver);flex:none;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,transparent 0 2.2px,var(--c) 2.8px);box-shadow:inset 0 0 0 1px var(--line)}
.disc.lg{width:28px;height:28px;background:radial-gradient(circle,transparent 0 4px,var(--c) 4.7px)}
.discs{display:flex;flex-wrap:wrap;gap:4px}

/* Semaine */
.week-nav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;margin-block:8px 14px}
.wk{display:grid;justify-items:center;gap:2px;text-align:center}
.wk h1{font-stretch:72%;font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:-.005em}
.wk-back{margin-top:4px;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.recap{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.recap-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left}
.recap-head .eyebrow{flex:1}
.recap-tot{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.recap-head svg{flex:none;color:var(--muted);transition:transform .2s}
.recap-head[aria-expanded="false"] svg{transform:rotate(-90deg)}
.recap-body{display:grid;gap:10px;padding:0 14px 14px}
.recap-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.lgd{display:inline-block;width:14px;height:8px;margin-right:5px;border-radius:2px;vertical-align:0}
.lgd.done{background:var(--primary)}
.lgd.plan{background:var(--muted);opacity:.45}
.lgd.band,.rc-band{background:repeating-linear-gradient(135deg,var(--knurl) 0 2px,transparent 2px 5px)}
.lgd.band{box-shadow:inset 0 0 0 1px var(--line)}
.recap-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rc-row{display:grid;grid-template-columns:100px minmax(0,1fr) 54px;align-items:center;gap:10px}
.rc-name{display:flex;align-items:center;gap:7px;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-bar{position:relative;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.rc-band{position:absolute;top:0;bottom:0}
.rc-done{position:absolute;left:0;top:0;bottom:0;background:var(--primary)}
.rc-plan{position:absolute;top:0;bottom:0;background:var(--muted);opacity:.45}
.rc-val{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-val b{font-size:15px;color:var(--ink)}
.rc-scale{margin-top:-2px}
.rc-ticks{position:relative;height:14px}
.rc-ticks i{position:absolute;top:0;transform:translateX(-50%);font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.rc-ticks i:first-child{transform:none}
.rc-ticks i:last-child{transform:translateX(-100%)}
.recap-note{margin:0;font-size:12px;color:var(--muted)}
.wk-sum{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.plates{display:flex;gap:6px;flex-wrap:wrap}
.plate{width:22px;height:22px;border-radius:50%;border:2px solid var(--primary)}
.plate.full{background:radial-gradient(circle,var(--surface) 0 3px,var(--primary) 3.6px)}
.sum-txt{font-size:15px;color:var(--muted)}
.sum-txt b{font-stretch:72%;font-weight:800;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.src{margin:10px 2px 16px;font-size:13px;color:var(--muted)}
.sync-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin:10px 2px 12px}
.sync-row .src{margin:0;flex:1 1 200px;min-width:0}
.src.warn{color:var(--danger)}
.src.rot{margin-top:0}
.sync-btn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:650}
.days{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.day{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px 14px 14px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.day.is-rest{background:transparent}
.day.is-today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.d-date{display:grid;justify-items:center;align-content:start}
.dname{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.dnum{font-stretch:72%;font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.day.is-past .dnum{color:var(--muted)}
.d-today{margin-top:5px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:5px;background:var(--primary);color:var(--on-primary)}
.d-body{min-width:0;display:grid;align-content:start}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{font-size:13px;line-height:1.2;padding:5px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.slot.work{color:var(--ink)}
.slot.sport{background:var(--primary);color:var(--on-primary);font-weight:650}
.slot.unk{background:transparent;border:1px dashed var(--line)}
.assign{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;padding:12px;border-radius:var(--r-sm);background:var(--surface-2);width:100%;text-align:left}
.a-txt{display:grid;gap:3px;min-width:0;flex:1 1 150px}
.a-txt b{font-size:16px;font-weight:700;line-height:1.25}
.a-txt small{font-size:13px;color:var(--muted)}
.a-btns{display:flex;flex-wrap:wrap;gap:8px}
.foot-stack{display:grid;gap:8px}
.assign.done{flex-wrap:nowrap;justify-content:flex-start}
.ok-mark{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--on-primary)}
.d-add{display:inline-flex;align-items:center;gap:6px;margin-top:8px;min-height:32px;font-size:14px;color:var(--muted)}

/* Séances et historique */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-block:10px 16px}
.sec-head h1{font-stretch:72%;font-weight:800;font-size:34px;line-height:1;text-transform:uppercase}
.s-list,.h-list{display:grid;gap:12px}
.s-card,.h-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.s-main{width:100%;display:grid;gap:6px;padding:16px 16px 10px;text-align:left}
.s-main b{font-size:19px;font-weight:700;line-height:1.2}
.s-meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.s-ex{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s-note{font-size:13px;color:var(--muted);font-style:italic}
.pill{display:inline-block;margin-left:8px;vertical-align:3px;font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.s-actions{display:flex;align-items:center;gap:8px;padding:0 16px 14px}
.s-actions .spacer{flex:1}
.s-actions{flex-wrap:wrap}
.sec-head{flex-wrap:wrap}
.sec-btns{display:flex;gap:8px}
.r-list{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px}
.r-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:8px 6px 8px 2px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.r-row.dragging{position:relative;z-index:2;border-color:var(--primary);box-shadow:0 8px 24px var(--scrim)}
.handle{width:40px;height:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.r-row.dragging .handle{cursor:grabbing;color:var(--ink)}
.r-name{display:grid;gap:2px;min-width:0}
.r-name b{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-name small{font-size:13px;color:var(--muted)}
.mini.confirm{width:auto;padding:0 12px;border:1px solid var(--danger);color:var(--danger);font-size:14px;font-weight:650}
.h-btns{display:flex;flex-wrap:wrap;gap:8px}
.he-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-block:16px 18px}
.r-ex-head .grow{flex:1}
.links{display:flex;flex-wrap:wrap;gap:0 18px}
.empty{display:grid;justify-items:start;gap:14px;padding:22px 18px;border:1.5px dashed var(--line);border-radius:var(--r)}
.empty p{margin:0;color:var(--muted);max-width:60ch}
.empty-mini{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:15px;list-style:none}
.h-main{width:100%;display:grid;gap:3px;padding:14px 16px;text-align:left}
.h-date{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h-main b{font-size:17px;font-weight:700}
.h-main small{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.h-det{display:grid;gap:12px;justify-items:start;padding:12px 16px 14px;border-top:1px solid var(--line)}
.h-ex{display:grid;gap:6px}
.h-ex b{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:650}
.h-sets{display:flex;flex-wrap:wrap;gap:6px}
.h-set{font-size:13px;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:7px;background:var(--surface-2)}
.h-set.skip{opacity:.5;text-decoration:line-through}

/* Écrans plein format */
.screen{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.scr-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr-top .eyebrow{flex:1}
.scr-body{flex:1 0 auto;width:100%;max-width:560px;margin:0 auto;padding-block:4px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr-foot{position:sticky;bottom:0;z-index:3;background:var(--bg);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr-foot .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
.title-input{width:100%;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;font-stretch:72%;font-weight:800;font-size:32px;line-height:1.15;padding:6px 0 8px}
.title-input:focus{outline:none;border-color:var(--primary)}
.title-input::placeholder{color:var(--muted);opacity:.75}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-block:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stats>div{display:grid;gap:2px;padding:12px 8px;text-align:center}
.stats>div+div{border-left:1px solid var(--line)}
.stats small{font-family:var(--font-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stats b{font-stretch:72%;font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stats em{font-style:normal;font-size:16px}
.c-items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.c-item{display:grid;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ci-head{display:flex;align-items:center;gap:12px}
.ci-name{flex:1;min-width:0;display:grid;gap:2px}
.ci-name b{font-size:16px;font-weight:700;line-height:1.25}
.ci-name small,.p-txt small{font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ci-tools{display:flex;gap:2px}
.ci-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:480px){.ci-fields{grid-template-columns:repeat(4,minmax(0,1fr))}}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.psets{display:grid;gap:6px}
.pset{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1.3fr) 34px;align-items:center;gap:8px}
.pset-head span{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:center}
.c-item .link-btn{margin-top:0;justify-self:start}
.field input,.field select,.set input,.pset input{width:100%;height:44px;padding:0 8px;border-radius:10px;border:1px solid transparent;background:var(--surface-2);font-weight:650;font-size:17px;text-align:center;text-align-last:center;font-variant-numeric:tabular-nums;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus,.set input:focus,.pset input:focus,.search:focus{outline:none;border-color:var(--primary)}
.field input::placeholder,.set input::placeholder{color:var(--muted);font-weight:500}
.field .txt,.field select.txt{text-align:left;text-align-last:left;font-weight:500;font-size:16px;padding:0 12px}
.stepper{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;height:44px;border-radius:10px;background:var(--surface-2)}
.stepper button{height:44px;font-size:21px;font-weight:600}
.stepper output{text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.suffix{position:relative}
.suffix input{padding-right:30px}
.suffix i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--muted);pointer-events:none}
.hint{margin:0;font-size:13px;color:var(--muted)}

/* Tiroir de choix */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:var(--scrim)}
.sheet{width:100%;max-width:600px;margin:0 auto;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border-radius:22px 22px 0 0;animation:sheet-in .2s ease-out}
@keyframes sheet-in{from{transform:translateY(28px)}}
.sheet-head{padding-top:8px;padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grip{width:42px;height:5px;margin:2px auto 12px;border-radius:3px;background:var(--line)}
.sh-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sh-title h2{font-stretch:72%;font-weight:800;font-size:28px;line-height:1.05}
.search{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-block:12px 4px}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.chip.all{padding-left:13px}
.chips.sub{gap:6px;padding-block:8px 2px;border-top:1px dashed var(--line);margin-top:8px}
.chips.sub .chip{height:32px;padding:0 11px;font-size:13px;background:var(--surface-2);border-color:transparent}
.chip[aria-pressed="true"],.chips.sub .chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sheet-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-scroll>.btn-dashed:first-child{margin-top:8px}
.p-count{margin:2px 2px 8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.p-list,.ch-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ch-list{margin-top:6px}
.p-row{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.p-row.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.p-txt{display:grid;gap:3px;min-width:0}
.p-txt b{font-size:16px;font-weight:650;line-height:1.25}
.p-alias{font-size:13px;color:var(--muted);font-style:italic}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.p-row.on .box{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sheet-foot{border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.new-ex{display:grid;gap:12px;margin-block:8px 14px;padding:14px;border-radius:var(--r);background:var(--bg)}
.new-ex h3{font-size:17px;font-weight:700}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row{display:flex;gap:10px}

/* Séance en cours */
.run-title{flex:1;min-width:0;display:grid;gap:1px}
.run-title b{font-stretch:72%;font-weight:800;font-size:24px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{flex:none;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--font-mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.knurl{flex:none;height:12px;background-image:repeating-linear-gradient(45deg,var(--knurl) 0 1.5px,transparent 1.5px 5px),repeating-linear-gradient(-45deg,var(--knurl) 0 1.5px,transparent 1.5px 5px)}
.r-prog{display:grid;gap:8px;margin-block:14px 16px}
.r-prog span{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);transition:width .3s}
.r-ex{margin-bottom:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.r-ex-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.r-ex-head div{display:grid;gap:2px;min-width:0}
.r-ex-head h3{font-size:18px;font-weight:700;line-height:1.25}
.r-ex-head small{font-size:13px;color:var(--muted)}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:32px minmax(0,1fr) minmax(0,1.3fr) 50px;align-items:center;gap:8px}
.set-head span{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:center}
.set input{height:46px}
.set-n{text-align:center;font-stretch:72%;font-weight:800;font-size:21px;color:var(--muted);font-variant-numeric:tabular-nums}
.check{width:50px;height:46px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);color:var(--muted)}
.set.done .check{background:var(--ok);border-color:var(--ok);color:var(--on-primary)}
.set.done input{color:var(--muted)}
.set.done .set-n{color:var(--ok)}
.cset{display:grid;grid-template-columns:32px minmax(0,1fr) 50px;align-items:center;gap:8px}
.cset+.cset{margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.cfields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cset.done .check{background:var(--ok);border-color:var(--ok);color:var(--on-primary)}
.cset.done .set-n{color:var(--ok)}
.cset.done input{color:var(--muted)}
.suffix.wide input{padding-right:46px}
.rest{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),420px);display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:10px 10px 12px 16px;border-radius:16px;overflow:hidden;background:var(--primary);color:var(--on-primary);box-shadow:0 10px 30px var(--scrim)}
.rest.over{background:var(--ok)}
.rest-bar{position:absolute;left:0;right:0;bottom:0;height:4px}
.rest-bar i{display:block;height:100%;background:var(--p-yellow)}
.rest-l{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.rest-t{font-stretch:72%;font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.rest-b{height:38px;padding:0 12px;border-radius:10px;border:1px solid currentColor;font-size:14px;font-weight:650}

/* Onglets et toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{position:relative;display:grid;justify-items:center;gap:3px;padding:10px 0 9px;font-size:12px;font-weight:650;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:max-content;max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:600;box-shadow:0 6px 24px var(--scrim)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ——— Version installable : finitions bleu nuit ——— */
.top-right{display:flex;align-items:center;gap:10px}
.icon-btn.sm{width:38px;height:38px;background:var(--surface-2)}
.icon-btn{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.brand{color:var(--primary-2)}
.wk h1,.sec-head h1{background:linear-gradient(180deg,var(--ink) 30%,var(--primary-2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.wk-sum,.recap,.day:not(.is-rest),.s-card,.h-card,.c-item,.r-ex,.card,.tile,.stats{box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px -18px rgba(0,0,0,.6)}
.day.is-today{background:linear-gradient(160deg,rgba(124,196,255,.10),transparent 55%),var(--surface)}
.day.is-rest{border-style:dashed}
.slot.sport{box-shadow:0 0 0 3px rgba(124,196,255,.14)}
.btn.primary{background:linear-gradient(180deg,#9AD2FF,var(--primary));box-shadow:0 6px 18px -8px rgba(124,196,255,.65)}
.btn.ghost{background:var(--surface-2)}
.tabs{background:rgba(12,19,41,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tab{font-size:11.5px}
.tab[aria-current="page"]{color:var(--primary-2)}
.tab[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(124,196,255,.55))}
.field input,.field select,.set input,.pset input{background:var(--surface-3)}
.search{background:var(--surface-3)}
.banner.backup{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--amber-soft);border:1px solid rgba(255,184,107,.35)}
.banner.backup div:first-child{display:grid;gap:1px;min-width:0}
.banner.backup b{color:var(--amber)}
.banner.backup span{font-size:13px;color:var(--muted)}
.bk-btns{display:flex;align-items:center;gap:4px;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:16px;font-weight:700;margin-bottom:6px}
.card h3 small{font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.pill{display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}

/* Réglages */
.set-block{display:grid;gap:10px;justify-items:start;padding:14px;margin-bottom:12px;border-radius:var(--r);background:var(--surface-2)}
.set-block h3{font-size:16px;font-weight:700}
.set-block .row{width:100%}
.set-block .search{width:100%}
.imp-confirm{display:grid;gap:10px;width:100%;padding:12px;border-radius:12px;background:var(--amber-soft);border:1px solid rgba(255,184,107,.35)}
.imp-confirm p{margin:0;font-size:14px}

/* Conseil de charge */
.advice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:-2px 0 12px;padding:10px 12px;border-radius:12px;background:var(--amber-soft);border:1px solid rgba(255,184,107,.35);font-size:14px}
.advice b{color:var(--amber)}
.btn.amber{background:var(--amber);color:#2A1600;border-color:transparent}

/* Graphiques */
.chart{position:relative;margin-top:8px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-yl,.ch-xl{fill:var(--muted);font-family:var(--font-mono);font-size:10.5px}
.ch-val{fill:var(--ink);font-family:var(--font-ui);font-stretch:72%;font-weight:800;font-size:15px}
.ch-line{fill:none;stroke:#3D93E8;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.anim .ch-line{stroke-dasharray:1;stroke-dashoffset:0;animation:ch-draw 1s ease-out both}
.anim .ch-area{animation:ch-fade 1.1s ease-out both}
.ch-pt{fill:#3D93E8;stroke:var(--surface);stroke-width:2}
.ch-dot2{fill:var(--muted);opacity:.55}
.ch-last{fill:var(--primary-2);stroke:var(--surface);stroke-width:2}
.ch-halo{fill:#3D93E8;opacity:.22;animation:ch-pulse 2.6s ease-in-out infinite}
@keyframes ch-draw{from{stroke-dashoffset:1}}
@keyframes ch-fade{from{opacity:0}}
@keyframes ch-pulse{50%{opacity:.08}}
.ch-x{position:absolute;top:22px;bottom:26px;width:1px;background:var(--primary);opacity:.45;pointer-events:none}
.ch-tip{position:absolute;top:-6px;transform:translate(-50%,-100%);pointer-events:none;z-index:2;padding:7px 10px;border-radius:10px;background:var(--surface-3);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ch-tip b{display:block;font-size:14px;color:var(--ink)}
.ch-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.lgd.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.7}
.lgd.line{width:16px;height:3px;border-radius:2px;background:#3D93E8}
.spark{width:84px;height:28px;flex:none}
.sp-line{fill:none;stroke:#3D93E8;stroke-width:2;stroke-linecap:round}
.sp-dot{fill:var(--primary-2)}

/* Progression */
.pg-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pg-main{padding-bottom:12px}
.pg-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pg-kpi{display:grid;gap:4px;min-width:0}
.kpi-big{font-stretch:72%;font-weight:800;font-size:46px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#FFFFFF,var(--primary));-webkit-background-clip:text;background-clip:text;color:transparent}
.pg-deltas{display:flex;flex-wrap:wrap;gap:6px}
.delta{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:12.5px;font-weight:650;font-variant-numeric:tabular-nums;background:var(--surface-2)}
.delta i{font-style:normal;font-size:9px}
.delta em{font-style:normal;font-weight:500;color:var(--muted)}
.delta.up{color:var(--ok)}
.delta.down{color:var(--danger)}
.delta.flat{color:var(--muted)}
.pg-side{display:grid;grid-template-columns:auto auto;align-content:start;gap:2px 10px;margin:0}
.pg-side dt{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-self:center}
.pg-side dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.pg-wait{margin:12px 0 0}
.pg-h2{font-size:13px;font-family:var(--font-mono);font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px}
.ex-list{display:grid;gap:8px}
.ex-item{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ex-item.open{border-color:rgba(124,196,255,.45)}
.ex-row{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"d t s" "d t v";align-items:center;gap:2px 12px;padding:12px 14px;text-align:left}
.ex-row .disc{grid-area:d}
.ex-txt{grid-area:t;display:grid;gap:2px;min-width:0}
.ex-txt b{font-size:15px;font-weight:650;line-height:1.25}
.ex-txt small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex-row .spark{grid-area:s;justify-self:end}
.ex-dl{grid-area:v;justify-self:end}
.ex-open{padding:0 14px 14px;display:grid;gap:8px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2);overflow-x:auto}
.seg button{flex:1;min-height:34px;padding:0 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

/* Corps */
.cp-form{display:grid;gap:12px}
.cp-form-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cp-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cp-fields .field:first-child{grid-column:1/-1}
.cp-taille{display:grid;gap:10px;justify-items:start}
.cp-taille .field{width:100%;max-width:200px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{display:grid;gap:3px;padding:14px;border-radius:16px;background:linear-gradient(165deg,rgba(124,196,255,.08),transparent 60%),var(--surface);border:1px solid var(--line)}
.tile b{font-stretch:72%;font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile b em{font-style:normal;font-size:15px;font-weight:700;color:var(--muted)}
.tile small{font-size:12px;color:var(--muted)}
.cp-list{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.cp-row{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.cp-row-main{flex:1;display:flex;justify-content:space-between;gap:10px;min-height:42px;align-items:center;text-align:left;min-width:0}
.cp-d{font-size:14px;font-weight:600}
.cp-v{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cp-note{margin:4px 2px 16px}
</style>
</head>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var slug=function(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);};
var num=function(v){if(v===''||v==null)return null;var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;};
var fmtN=function(n){return n==null?'':Number(n).toLocaleString('fr-FR',{maximumFractionDigits:2});};
var pad=function(n){return String(n).padStart(2,'0');};

function planSets(it){if(hasPS(it))return it.sets.map(function(s){return {reps:s.reps,charge:s.charge};});var n=Math.max(1,+it.series||1),a=[];for(var k=0;k<n;k++)a.push({reps:it.reps,charge:it.charge});return a;}
function estimate(items){var s=0;(items||[]).forEach(function(it){var ps=hasPS(it),n=ps?it.sets.length:(+it.series||0),r=ps?(it.sets.reduce(function(a,x){return a+(+x.reps||0);},0)/it.sets.length):(+it.reps||0),rp=+it.repos||0;if(it.unite==='min')s+=n*r*60+60;else if(it.unite==='s')s+=n*(r+rp)+60;else s+=n*((r||10)*3.5+rp)+60;});var m=Math.round(s/60);return m<10?m:Math.round(m/5)*5;}

function rebuildHist(){var m=Object.assign({},S.histMap);pendingGet().forEach(function(x){if(!m[x.id])m[x.id]=x.body;});S.hist=Object.keys(m).map(function(id){return Object.assign({id:id},m[id]);}).sort(function(a,b){return String(b.debut||b.date||'').localeCompare(String(a.debut||a.date||''));});}
function lastPerf(exId){for(var k=0;k<S.hist.length;k++){var h=S.hist[k];var it=(h.items||[]).find(function(x){return x.exId===exId;});if(it){var sets=(it.sets||[]).filter(function(s){return s.fait;});if(sets.length)return {date:h.date,sets:sets,unite:it.unite};}}return null;}
/* Cardio : durée, vitesse, inclinaison (tapis), distance calculée si elle n'est pas saisie */
function isTapis(it){return /tapis/.test(slug(it&&it.nom||''));}
function autoDist(min,vit){min=num(min);vit=num(vit);return (min&&vit)?Math.round(vit*min/60*100)/100:null;}
function setDist(s){var d=num(s.dist);return d!=null?d:autoDist(s.reps,s.vitesse);}
function fmtCardio(s){var m=num(s.reps),v=num(s.vitesse),inc=num(s.incl),d=setDist(s);return (m==null?'?':fmtN(m))+' min'+(v?' · '+fmtN(v)+' km/h':'')+(inc?' · '+fmtN(inc)+' %':'')+(d?' · '+fmtN(d)+' km':'');}
function outSet(s,u){var o={reps:num(s.reps),charge:num(s.charge),fait:!!s.fait};if(u==='min'){o.vitesse=num(s.vitesse);o.incl=num(s.incl);o.dist=num(s.dist);}return o;}
function histKm(h){var t=0;(h.items||[]).forEach(function(it){if(it.unite==='min')(it.sets||[]).forEach(function(s){if(s.fait){var d=setDist(s);if(d)t+=d;}});});return Math.round(t*100)/100;}
function histSum(h){var km=histKm(h),n=h.seriesFaites||0,p=[];if(h.dureeMin!=null)p.push(h.dureeMin+' min');p.push(n+' série'+(n>1?'s':''));if(h.tonnage||!km)p.push(fmtN(h.tonnage||0)+' kg soulevés');if(km)p.push(fmtN(km)+' km');return p.join(' · ');}

function fmtSets(sets,unite){if(unite==='min')return sets.map(fmtCardio).join(', ');var u=unite==='min'?' min':unite==='s'?' s':'';var p=sets.map(function(s){return {r:num(s.reps),c:num(s.charge)};});var one=function(x){return (x.r==null?'?':fmtN(x.r))+u+(x.c?' · '+fmtN(x.c)+' kg':'');};var same=p.every(function(x){return x.r===p[0].r&&x.c===p[0].c;});return same?(p.length+' × '+one(p[0])):p.map(one).join(', ');}

/* Sauvegarde en ligne */
function errMsg(e){var c=e&&e.code;if(c==='quota_exceeded')return 'Stockage plein : retire d’anciennes séances de l’historique.';if(c==='invalid_argument'||c==='transform_error')return 'Enregistrement refusé : données invalides.';if(c==='revoked'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed')return 'La sauvegarde n’est plus autorisée sur cette page.';if(c==='resource_exhausted')return 'Trop d’enregistrements d’un coup : réessaie dans un instant.';return 'Pas de connexion : l’enregistrement n’a pas abouti, réessaie dans un instant.';}
function newId(coll){try{if(S.db)return S.db.collection(coll).doc().id;}catch(e){}return uid();}
async function persist(coll,id,body){
  var map=S[MAPKEY[coll]];
  if(body===null)delete map[id];else map[id]=body;
  if(coll==='historique')rebuildHist();
  if(!S.db)return true;
  var ref=S.db.doc(coll+'/'+id);
  var run=function(){return body===null?ref.delete():ref.set(body);};
  try{await run();return true;}
  catch(e){var err=e;if(e&&e.code==='unavailable'){await sleep(400+Math.random()*800);try{await run();return true;}catch(e2){err=e2;}}toast(errMsg(err));return false;}
}
async function flushPending(){if(!S.db)return;var a=pendingGet();if(!a.length)return;var rest=[];for(var k=0;k<a.length;k++){try{await S.db.doc('historique/'+a[k].id).set(a[k].body);}catch(e){rest.push(a[k]);}}pendingSet(rest);rebuildHist();refresh();}
var SUBS=['exos','seances','planning','jours','historique','meta','corps'];
/* Stockage sur le téléphone : même interface que la base en ligne de l'ancienne version, mais dans le navigateur */
function makeLocalDB(KEY){
  var store={},subs={};
  try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){store={};}
  function snap(c){var m=store[c]||{};return {docs:Object.keys(m).map(function(id){var d=m[id];return {id:id,exists:true,data:function(){return d;}};}),metadata:{fromCache:false,hasPendingWrites:false}};}
  function emit(c){(subs[c]||[]).forEach(function(cb){try{cb(snap(c));}catch(e){console.error(e);}});}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(store));return true;}catch(e){return false;}}
  function split(p){var a=String(p).split('/');return {c:a.slice(0,-1).join('/'),id:a[a.length-1]};}
  return {
    collection:function(c){return {
      onSnapshot:function(cb){(subs[c]=subs[c]||[]).push(cb);setTimeout(function(){cb(snap(c));},0);return function(){subs[c]=(subs[c]||[]).filter(function(x){return x!==cb;});};},
      doc:function(id){return {id:id||uid()};}
    };},
    doc:function(p){var s=split(p);return {
      set:function(b){store[s.c]=store[s.c]||{};var prev=store[s.c][s.id];store[s.c][s.id]=JSON.parse(JSON.stringify(b));
        if(!save()){if(prev===undefined)delete store[s.c][s.id];else store[s.c][s.id]=prev;return Promise.reject({code:'quota_exceeded'});}
        emit(s.c);return Promise.resolve();},
      delete:function(){if(store[s.c])delete store[s.c][s.id];save();emit(s.c);return Promise.resolve();}
    };},
    dump:function(){return JSON.parse(JSON.stringify(store));},
    replace:function(ns){var old=store;store=ns||{};if(!save()){store=old;return false;}SUBS.forEach(emit);return true;}
  };
}

/* Planning : lecture du tableur Google partagé par lien, à chaque ouverture */
function nearestDate(day,month,today){var best=null,bd=Infinity;[-1,0,1].forEach(function(dy){var d=new Date(today.getFullYear()+dy,month-1,day);var diff=Math.abs(d-today);if(diff<bd){bd=diff;best=d;}});return best;}
function parsePlanning(values,today){
  var out={};
  for(var r=0;r<values.length;r++){
    var row=values[r]||[],wk=String(row[0]==null?'':row[0]).trim(),dates=String(row[1]==null?'':row[1]).trim();
    var mw=/^S\s*(\d{1,2})$/i.exec(wk),md=/(\d{1,2})\s*\/\s*(\d{1,2})/.exec(dates);
    if(!mw||!md)continue;
    var next=values[r+1]||[],start=nearestDate(+md[1],+md[2],today);
    for(var c=0;c<7;c++){
      var a=String(row[2+c]==null?'':row[2+c]).trim(),b=String(next[2+c]==null?'':next[2+c]).trim();
      out[iso(addDays(start,c))]={semaine:+mw[1],creneaux:[a||'?',b||'?']};
    }
  }
  return out;
}
function parseCSV(t){
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true;else if(ch===','){row.push(f);f='';}else if(ch==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(ch!=='\r')f+=ch;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function sheetIdOf(v){var m=/\/d\/([a-zA-Z0-9_-]{20,})/.exec(v||'');if(m)return m[1];var s=String(v||'').trim();return /^[a-zA-Z0-9_-]{20,}$/.test(s)?s:'';}
async function fetchSheet(id){
  var base='https://docs.google.com/spreadsheets/d/'+encodeURIComponent(id)+'/gviz/tq?tqx=out:csv&headers=0';
  var urls=[base+'&sheet=Planning',base],lastErr=null;
  for(var k=0;k<urls.length;k++){
    try{
      var r=await fetch(urls[k],{cache:'no-store'});
      if(!r.ok){lastErr={code:'http',status:r.status};continue;}
      var txt=await r.text();
      if(/^\s*</.test(txt)){lastErr={code:'private'};continue;}
      var parsed=parsePlanning(parseCSV(txt),new Date());
      if(Object.keys(parsed).length)return parsed;
      lastErr={code:'empty'};
    }catch(e){lastErr={code:navigator.onLine===false?'offline':'network'};}
  }
  throw lastErr||{code:'network'};
}
async function syncPlanning(){
  if(S.sync.state==='running')return;
  var id=(S.meta.config&&S.meta.config.sheetId)||'';
  if(!id){S.sync={state:'nosheet'};refresh();return;}
  S.syncStarted=true;S.sync={state:'running'};refresh();
  try{
    var parsed=await fetchSheet(id),ps=[];
    Object.keys(parsed).forEach(function(k){var cur=S.planning[k],nv=parsed[k];if(!cur||JSON.stringify(cur.creneaux)!==JSON.stringify(nv.creneaux)||cur.semaine!==nv.semaine)ps.push(persist('planning',k,nv));});
    ps.push(persist('meta','planning',{lu:new Date().toISOString(),source:'Google Sheets'}));
    await Promise.all(ps);
    S.sync={state:'ok',at:Date.now()};
  }catch(e){
    var c=e&&e.code;
    var msg=c==='offline'?'Pas de connexion : planning non mis à jour.'
      :c==='private'?'Ton tableur n’est plus partagé par lien : impossible de le lire.'
      :c==='empty'?'Aucune semaine trouvée dans ton tableur (lignes du type « S45 | 02/11 - 08/11 » attendues).'
      :c==='http'?'Google a refusé la lecture du tableur (erreur '+e.status+').'
      :'Impossible de joindre ton tableur pour l’instant.';
    S.sync={state:'error',msg:msg,action:'sync',label:'Réessayer',at:Date.now()};
  }
  refresh();
}
function connect(){
  S.db=makeLocalDB('carnet-db-v1');
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  SUBS.forEach(function(c){
    S.db.collection(c).onSnapshot(function(snap){
      var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});
      S[MAPKEY[c]]=m;
      if(c==='historique')rebuildHist();
      S.got[c]=true;if(SUBS.every(function(x){return S.got[x];}))S.loading=false;
      refresh();
    });
  });
  setTimeout(function(){syncPlanning();},400);
}

function readImport(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var j=JSON.parse(fr.result),d=j&&j.data;
      if(!d||typeof d!=='object'||(!d.seances&&!d.historique&&!d.planning&&!d.corps))throw 0;
      IMP={data:d,nb:{s:Object.keys(d.seances||{}).length,h:Object.keys(d.historique||{}).length,c:Object.keys(d.corps||{}).length}};
      var has=Object.keys(S.seances).length||S.hist.length||Object.keys(S.corps).length;
      if(!has)applyImport();else renderSettings();
    }catch(e){toast('Ce fichier n’est pas une sauvegarde de Fonte.');}
  };
  fr.onerror=function(){toast('Lecture du fichier impossible.');};
  fr.readAsText(file);
}
function applyImport(){
  if(!IMP)return;
  var d=IMP.data,nb=IMP.nb,clean={};IMP=null;
  SUBS.forEach(function(c){if(d[c]&&typeof d[c]==='object')clean[c]=d[c];});
  if(!S.db.replace(clean)){toast('Pas assez de place sur le téléphone pour importer.');return;}
  rebuildHist();closeSheet();S.sync={state:'idle'};
  toast('Données importées : '+nb.s+' séance'+(nb.s>1?'s':'')+', '+nb.h+' faite'+(nb.h>1?'s':''));
  renderMain();syncPlanning();
}

/* Conseil de charge : toutes les répétitions faites la dernière fois → on propose d'ajouter un cran */
function adviceFor(it,last){
  if(!last||it.unite!=='reps')return null;
  var plan=planSets(it),ls=last.sets;
  if(!ls.length||ls.length<plan.length)return null;
  for(var k=0;k<plan.length;k++){var tg=num(plan[k].reps),dn=num(ls[k].reps);if(tg==null||dn==null||dn<tg)return null;}
  if(!ls.some(function(s){return num(s.charge);}))return null;
  return {step:(it.materiel==='Haltères'||it.materiel==='Kettlebell')?1:2.5,applied:false};
}

/* Graphiques */
var CHARTS={},chartSeq=0;
function niceTicks(mn,mx,n){
  if(mn===mx){var dd=Math.abs(mn)*0.1||1;mn-=dd;mx+=dd;}
  var span=mx-mn,step=Math.pow(10,Math.floor(Math.log10(span/n))),err=span/n/step;
  if(err>=7.5)step*=10;else if(err>=3.5)step*=5;else if(err>=1.5)step*=2;
  var lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step,out=[];
  for(var v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(6));
  return out;
}
function smoothPath(q){var d='M'+q[0].x.toFixed(1)+' '+q[0].y.toFixed(1);for(var i=1;i<q.length;i++){var a=q[i-1],b=q[i],m=(a.x+b.x)/2;d+=' C'+m.toFixed(1)+' '+a.y.toFixed(1)+' '+m.toFixed(1)+' '+b.y.toFixed(1)+' '+b.x.toFixed(1)+' '+b.y.toFixed(1);}return d;}
function lineChart(pts,o){
  o=o||{};
  var W=340,H=o.h||190,pl=48,pr=16,pt=24,pb=26,id='ch'+(++chartSeq),fmt=o.fmt||fmtN,tick=o.tick||fmt;

  return '<div class="chart" data-chart="'+id+'"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Graphique')+'">'+defs+grid+body+lab+xl+'</svg><div class="ch-x" hidden></div><div class="ch-tip" hidden></div></div>';

function spark(vals){

function chartHover(e){

/* Progression */
function fmtT(kg){kg=+kg||0;return kg>=1000?(kg/1000).toLocaleString('fr-FR',{maximumFractionDigits:kg>=10000?1:2})+' t':fmtN(Math.round(kg))+' kg';}
function pct(a,b){if(!b)return null;return (a-b)/b*100;}
function deltaHtml(p,label){if(p==null||!isFinite(p))return '';var r=Math.round(p*10)/10,cls=r>0?'up':r<0?'down':'flat';return '<span class="delta '+cls+'"><i aria-hidden="true">'+(r>0?'▲':r<0?'▼':'■')+'</i>'+(r>0?'+':'')+fmtN(r)+' %'+(label?' <em>'+esc(label)+'</em>':'')+'</span>';}
function exStats(hs,exId){
  var out=[];
  hs.forEach(function(h){
    var it=(h.items||[]).find(function(x){return x.exId===exId;});if(!it)return;
    var sets=(it.sets||[]).filter(function(s){return s.fait;});if(!sets.length)return;
    if(it.unite==='min'){var dist=0,dur=0;sets.forEach(function(s){dur+=num(s.reps)||0;var d=setDist(s);if(d)dist+=d;});out.push({x:h.date,dist:Math.round(dist*100)/100,dur:dur,cardio:true});return;}
    var ton=0,best=null,e1=0;
    sets.forEach(function(s){var r=num(s.reps)||0,c=num(s.charge)||0;ton+=r*c;if(!best||c>best.c||(c===best.c&&r>best.r))best={r:r,c:c};var est=c*(1+r/30);if(est>e1)e1=est;});
    out.push({x:h.date,ton:Math.round(ton),best:best,max:best?best.c:0,e1:Math.round(e1*10)/10,reps:it.unite==='s'?'s':'reps'});
  });
  return out;
}
var METRICS=[{k:'ton',l:'Charge totale',f:function(v){return fmtT(v);}},{k:'max',l:'Charge max',f:function(v){return fmtN(v)+' kg';}},{k:'e1',l:'Force (1RM estimé)',f:function(v){return fmtN(v)+' kg';}}];
function progHtml(){
  var L=sortedSeances(),head='<div class="sec-head"><h1>Progression</h1></div>';

  var s=S.seances[sel];
  var chips='<div class="pg-chips" role="group" aria-label="Choisir la séance">'+L.map(function(x){return '<button class="chip" data-act="pg-sel" data-id="'+esc(x.id)+'" aria-pressed="'+(x.id===sel)+'">'+disc(groupsOf(x.items||[])[0])+esc(x.nom)+'</button>';}).join('')+'</div>';
  var hs=S.hist.filter(function(h){return h.seanceId===sel;}).slice().sort(function(a,b){return String(a.debut||a.date).localeCompare(String(b.debut||b.date));});
  var pts=hs.map(function(h){return {x:h.date,y:h.tonnage||0,tip:fmtT(h.tonnage||0)};});
  var main;
  if(!hs.length)main='<div class="card pg-main"><p class="hint">Pas encore de « '+esc(s.nom)+' » enregistrée. Lance-la depuis la Semaine ou l’onglet Séances : chaque séance terminée ajoute un point ici.</p></div>';
  else{
    var last=pts[pts.length-1].y,prev=pts.length>1?pts[pts.length-2].y:null,first=pts[0].y,rec=Math.max.apply(null,pts.map(function(p){return p.y;}));
    main='<div class="card pg-main"><div class="pg-top"><div class="pg-kpi"><span class="eyebrow">Charge totale · dernière séance</span><div class="kpi-big">'+fmtT(last)+'</div><div class="pg-deltas">'
      +(prev!=null?deltaHtml(pct(last,prev),'vs la fois d’avant'):'')+(pts.length>2?deltaHtml(pct(last,first),'depuis le début'):'')+'</div></div>'
      +'<dl class="pg-side"><dt>Record</dt><dd>'+fmtT(rec)+'</dd><dt>Séances</dt><dd>'+pts.length+'</dd></dl></div>'

  }

  var list=(s.items||[]).map(function(it){

      sub='Dernière fois';

      if(open)expanded=st.length?lineChart(st.map(function(p){return {x:p.x,y:p.dist||p.dur,tip:(p.dist?fmtN(p.dist)+' km · ':'')+fmtN(p.dur)+' min'};}),{fmt:function(v){return fmtN(Math.round(v*10)/10)+(st[0].dist?' km':' min');},label:it.nom}):'';
    }else{

      if(lb&&lb.best)val=fmtN(lb.best.r)+(lb.reps==='s'?' s':'')+' × '+fmtN(lb.best.c)+' kg';
      sub='Meilleure série';
      if(st.length>1)dl=deltaHtml(pct(vals[vals.length-1],vals[0]));
      if(open){
        var seg='<div class="seg" role="group" aria-label="Mesure affichée">'+METRICS.map(function(m){return '<button data-act="pg-metric" data-m="'+m.k+'" aria-pressed="'+(m.k===metric.k)+'">'+m.l+'</button>';}).join('')+'</div>';
        expanded=seg+(st.length>1?lineChart(st.map(function(p){return {x:p.x,y:p[metric.k],tip:metric.f(p[metric.k])+(p.best?' · meilleure série '+fmtN(p.best.r)+' × '+fmtN(p.best.c)+' kg':'')};}),{fmt:metric.f,label:it.nom+' : '+metric.l}):'<p class="hint">Il faut au moins deux séances pour tracer la courbe.</p>');
        if(metric.k==='e1')expanded+='<p class="hint">1RM estimé : la charge que tu pourrais soulever une seule fois, calculée à partir de tes séries (formule d’Epley). C’est un repère, pas un test.</p>';
      }

      +'<span class="ex-txt"><b>'+esc(it.nom)+'</b><small>'+esc(sub)+' : '+esc(val)+'</small></span>'+spark(vals)+'<span class="ex-dl">'+dl+'</span></button>'
      +(open?'<div class="ex-open">'+expanded+'</div>':'')+'</div>';
  }).join('');

/* Corps : poids, masse grasse, IMC, FFMI */
function corpsEntries(){return Object.keys(S.corps).sort().map(function(k){return Object.assign({date:k},S.corps[k]);}).filter(function(e){return num(e.poids)!=null||num(e.mg)!=null;});}

function slotInfo(v){var s=String(v==null?'':v).trim(),u=s.toUpperCase();if(!s||u==='?')return {k:'unk',t:'?'};if(u==='SPORT')return {k:'sport',t:'Salle'};if(u==='REPOS')return {k:'repos',t:'Repos'};if(u==='CP')return {k:'off',t:'Congé'};if(u==='FERIE'||u==='FÉRIÉ')return {k:'off',t:'Férié'};if(/\d/.test(s))return {k:'work',t:'Travail '+s.toLowerCase().replace(/-/g,'–')};return {k:'other',t:s};}
function slotsHtml(slots){
  if(!slots)return '<div class="slots"><span class="slot unk">'+(S.loading&&!S.got.planning?'Chargement…':'Pas de planning')+'</span></div>';
  var infos=slots.map(slotInfo);
  if(infos.every(function(x){return x.k==='unk';}))return '<div class="slots"><span class="slot unk">Planning non rempli</span></div>';
  var seen={},out=[];
  infos.forEach(function(x){if(x.k==='unk')return;var key=x.k+x.t;if(seen[key])return;seen[key]=1;out.push('<span class="slot '+x.k+'">'+esc(x.t)+'</span>');});
  return '<div class="slots">'+out.join('')+'</div>';
}
function planSport(k){var p=S.planning[k];return !!(p&&Array.isArray(p.creneaux)&&p.creneaux.some(function(v){return String(v).trim().toUpperCase()==='SPORT';}));}
function manualOf(k){var j=S.jours[k];return j&&j.seanceId&&S.seances[j.seanceId]?j.seanceId:null;}
/* Rotation : chaque jour « Salle » à venir prend la séance suivante dans l'ordre de l'onglet Séances,
   en partant de la dernière séance faite. Un choix manuel pour un jour devient le nouveau point de départ. */
function rotation(endK){
  var res={},order=sortedSeances().map(function(s){return s.id;}),n=order.length,today=iso(new Date());
  if(!n||endK<today)return res;
  var ptr=-1;
  for(var a=0;a<S.hist.length;a++){var h=S.hist[a];if(h.date<=today&&order.indexOf(h.seanceId)>=0){ptr=order.indexOf(h.seanceId);break;}}
  var d=parseIso(today);
  for(var g=0;g<800;g++){
    var k=iso(d);if(k>endK)break;
    var j=S.jours[k],man=manualOf(k);
    var done=S.hist.some(function(x){return x.date===k;});
    if(!done&&!(j&&j.aucune)){
      if(man){ptr=order.indexOf(man);res[k]={seanceId:man,auto:false};}
      else if(planSport(k)){ptr=(ptr+1)%n;res[k]={seanceId:order[ptr],auto:true};}
    }
    d=addDays(d,1);
  }
  return res;
}
function dayInfo(k,rot){
  var p=S.planning[k];var slots=(p&&Array.isArray(p.creneaux))?p.creneaux:null;
  var fromPlan=planSport(k),j=S.jours[k],aucune=!!(j&&j.aucune),man=manualOf(k),r=rot?rot[k]:null;
  var sid=r?r.seanceId:man;
  return {k:k,slots:slots,fromPlan:fromPlan,aucune:aucune,sport:(fromPlan&&!aucune)||!!man,seanceId:sid,seance:sid?S.seances[sid]:null,auto:!!(r&&r.auto),done:S.hist.filter(function(h){return h.date===k;})};
}

  }else if(info.seance){

            :'<button class="btn primary sm" data-act="d-start" data-date="'+info.k+'" data-id="'+esc(info.seanceId)+'">Commencer</button>');
    body='<div class="assign"><div class="a-txt"><span class="discs">'+groupsOf(items).map(function(g){return disc(g);}).join('')+'</span><b>'+esc(s.nom)+'</b><small>'+(past?'Prévue · pas enregistrée':meta)+'</small></div><div class="a-btns">'+btns+'</div></div>'
      +(isToday?'<button class="d-add" data-act="d-mark" data-date="'+info.k+'" data-id="'+esc(info.seanceId)+'">'+svg(IC.check,16)+' Déjà faite ? Marquer comme faite</button>':'');
  }else if(info.aucune){
    body='<button class="d-add" data-act="d-choose" data-date="'+info.k+'">Pas de séance ce jour-là · Changer</button>';
  }else if(info.sport){

             :'<button class="btn-dashed sm" data-act="d-choose" data-date="'+info.k+'">'+svg(IC.plus,18)+' Choisir la séance</button>';
  }else{
    body='<button class="d-add" data-act="d-choose" data-date="'+info.k+'">'+svg(IC.plus,16)+' '+(past?'Indiquer une séance faite':'Ajouter une séance')+'</button>';
  }
  return '<li class="day '+(info.sport||info.done.length?'is-sport':'is-rest')+(isToday?' is-today':'')+(past?' is-past':'')+'"><div class="d-date"><span class="dname">'+JC[wdIdx(d)]+'</span><span class="dnum">'+d.getDate()+'</span>'+(isToday?'<span class="d-today">auj.</span>':'')+'</div><div class="d-body">'+slotsHtml(info.slots)+body+'</div></li>';

function weekHtml(){

  var planned=0,doneDays=0,anyPlan=false,rows='',rot=rotation(iso(addDays(mon,6)));
  for(var i=0;i<7;i++){var d=addDays(mon,i),info=dayInfo(iso(d),rot);if(info.slots)anyPlan=true;if(info.sport)planned++;if(info.done.length)doneDays++;rows+=dayHtml(d,info,today);}
  var nb=Math.max(planned,doneDays),plates='';
  for(var p=0;p<nb;p++)plates+='<span class="plate'+(p<doneDays?' full':'')+'"></span>';
  var sumTxt=nb?('<b>'+doneDays+'</b> faite'+(doneDays>1?'s':'')+' sur <b>'+planned+'</b> prévue'+(planned>1?'s':'')):'Aucune séance prévue';
  var lu=S.meta.planning&&S.meta.planning.lu,st=S.sync||{},src,warn=false,act='';
  var luTxt=lu?(dShort(iso(new Date(lu)))+' à '+hm(lu)):'';
  if(st.state==='running')src='Lecture de ton tableur Google…';
  else if(st.state==='nosheet')src='Ajoute le lien de ton tableur dans les Réglages pour lire ton planning automatiquement.';
  else if(st.state==='error'){src=st.msg+(lu?' Dernière lecture le '+luTxt+'.':'');warn=true;}
  else if(S.loading&&!S.got.planning&&!anyPlan)src='Chargement de ton planning…';
  else if(!anyPlan)src='Pas encore de planning pour cette semaine dans ton tableur.';
  else src=lu?('Planning lu dans ton tableur le '+luTxt+'.'):'Planning issu de ton tableur.';
  if(st.state!=='running'){
    if(st.state==='nosheet')act='<button class="sync-btn" data-act="settings">Réglages</button>';
    else if(st.state==='error'&&st.action==='perm')act='<button class="sync-btn" data-act="sync-perm">Gérer les autorisations</button>';
    else if(!(st.state==='error'&&!st.action))act='<button class="sync-btn" data-act="sync">'+svg(IC.refresh,15)+' '+(st.state==='error'&&st.label?esc(st.label):'Relire')+'</button>';
  }
  var rotNote=Object.keys(rot).some(function(k){return rot[k].auto;})?'Rotation : les jours « Salle » suivent l’ordre de l’onglet Séances, à partir de la dernière séance faite.':'';
  return '<div class="week-nav"><button class="icon-btn" data-act="w-prev" aria-label="Semaine précédente">'+svg(IC.left)+'</button><div class="wk"><span class="eyebrow">Semaine '+isoWeek(mon)+(cur?' · en cours':'')+'</span><h1>'+esc(weekLabel(mon))+'</h1>'+(cur?'':'<button class="wk-back" data-act="w-today">Revenir à cette semaine</button>')+'</div><button class="icon-btn" data-act="w-next" aria-label="Semaine suivante">'+svg(IC.right)+'</button></div>'

   +recapHtml(mon,rot,today)

   +(rotNote?'<p class="src rot">'+rotNote+'</p>':'')+'<ol class="days">'+rows+'</ol>';

/* Récapitulatif hebdo : séries directes par groupe musculaire (hors cardio), faites et encore prévues */
function recapCounts(mon,rot,today){
  var done={},plan={},start=iso(mon),end=iso(addDays(mon,6));
  GROUPES.forEach(function(g){if(g.id!=='cardio'){done[g.id]=0;plan[g.id]=0;}});
  S.hist.forEach(function(h){if(!h.date||h.date<start||h.date>end)return;(h.items||[]).forEach(function(it){if(it.unite==='min'||!(it.groupe in done))return;done[it.groupe]+=(it.sets||[]).filter(function(s){return s.fait;}).length;});});
  for(var i=0;i<7;i++){
    var k=iso(addDays(mon,i));if(k<today||S.hist.some(function(h){return h.date===k;}))continue;
    var r=rot?rot[k]:null,sid=r?r.seanceId:manualOf(k),s=sid?S.seances[sid]:null;if(!s)continue;
    (s.items||[]).forEach(function(it){if(it.unite==='min'||!(it.groupe in plan))return;plan[it.groupe]+=hasPS(it)?it.sets.length:(+it.series||1);});
  }
  return {done:done,plan:plan};
}
var RECAP_MAX=16;
function recapHtml(mon,rot,today){
  var c=recapCounts(mon,rot,today),td=0,tp=0;
  var ids=Object.keys(c.done).filter(function(g){return c.done[g]+c.plan[g]>0;});
  ids.forEach(function(g){td+=c.done[g];tp+=c.plan[g];});
  var M=RECAP_MAX,pc=function(v){return Math.min(100,v/M*100);};
  var open=S.recapOpen!==false;
  var head='<button class="recap-head" data-act="recap-toggle" aria-expanded="'+open+'"><span class="eyebrow">Séries par muscle</span><span class="recap-tot">'+td+' faite'+(td>1?'s':'')+(tp?' · '+tp+' prévue'+(tp>1?'s':''):'')+'</span>'+svg(IC.chev,18)+'</button>';
  if(!open)return '<section class="recap">'+head+'</section>';
  if(!ids.length)return '<section class="recap">'+head+'<div class="recap-body"><p class="recap-note">Aucune série faite ni prévue cette semaine.</p></div></section>';
  var rows=ids.map(function(g){var d=c.done[g],p=c.plan[g];
    return '<li class="rc-row"><span class="rc-name">'+disc(g)+esc(gName(g))+'</span><div class="rc-bar" role="img" aria-label="'+esc(gName(g))+' : '+d+' séries faites, '+p+' prévues, sur '+M+'"><span class="rc-done" style="width:'+pc(d)+'%"></span><span class="rc-plan" style="left:'+pc(d)+'%;width:'+(pc(d+p)-pc(d))+'%"></span></div><span class="rc-val"><b>'+d+'</b>'+(p?' +'+p:'')+'</span></li>';}).join('');
  var scale='<li class="rc-row rc-scale" aria-hidden="true"><span></span><div class="rc-ticks"><i style="left:0">0</i><i style="left:100%">'+M+'</i></div><span></span></li>';
  return '<section class="recap">'+head+'<div class="recap-body"><div class="recap-legend"><span><i class="lgd done"></i>Faites</span><span><i class="lgd plan"></i>Encore prévues</span></div><ul class="recap-list">'+rows+scale+'</ul><p class="recap-note">Séries directes cochées, hors échauffement et cardio. Les séries « prévues » viennent des séances des jours à venir.</p></div></section>';
}
function sortedSeances(){return Object.keys(S.seances).map(function(id){return Object.assign({id:id},S.seances[id]);}).sort(function(a,b){var ao=typeof a.ordre==='number',bo=typeof b.ordre==='number';if(ao&&bo)return a.ordre-b.ordre;if(ao!==bo)return ao?-1:1;return ((a.exemple?1:0)-(b.exemple?1:0))||String(a.nom).localeCompare(String(b.nom),'fr');});}
function nextOrdre(){var m=null;Object.keys(S.seances).forEach(function(id){var o=S.seances[id].ordre;if(typeof o==='number'&&(m===null||o>m))m=o;});return m===null?null:m+1;}

}

    if(t.id==='he-date'){H.date=t.value;return;}
    if(t.id==='he-duree'){H.dureeMin=t.value;return;}
    if(t.dataset&&t.dataset.hf){var row=H.items[+t.dataset.i];var hs=row&&row.sets[+t.dataset.j];if(hs){hs[t.dataset.hf]=t.value;updDistPh('he',+t.dataset.i,+t.dataset.j,hs);}return;}
  }
  if(t.id==='c-nom'&&C){C.nom=t.value;return;}
  if(t.id==='p-q'&&PK){PK.q=t.value;renderPickerList();return;}
  if(t.dataset&&t.dataset.pf&&C){var pli=t.closest('.c-item');if(!pli)return;var pit=C.items[+pli.dataset.i];var pss=pit&&pit.sets&&pit.sets[+t.dataset.j];if(!pss)return;
    if(t.dataset.pf==='reps'){var rv=parseInt(t.value,10);pss.reps=isFinite(rv)?rv:'';}else{var cv=num(t.value);pss.charge=cv==null?'':cv;}
    var pst=$('#c-stats');if(pst)pst.innerHTML=statsHtml(C.items);return;}
  if(t.dataset&&t.dataset.f&&C){var li=t.closest('.c-item');if(!li)return;var it=C.items[+li.dataset.i];if(!it)return;var f=t.dataset.f;
    if(f==='reps'){var v=parseInt(t.value,10);it.reps=isFinite(v)?v:'';}
    else if(f==='charge'){var c=num(t.value);it.charge=c==null?'':c;}
    else if(f==='repos'){it.repos=+t.value||0;}
    else if(f==='vitesse'){var vv=num(t.value);it.vitesse=vv==null?'':vv;}
    else if(f==='incl'){var ii=num(t.value);it.incl=ii==null?'':ii;}
    var st=$('#c-stats');if(st)st.innerHTML=statsHtml(C.items);return;}
  if(t.dataset&&t.dataset.rf&&R){var s=R.items[+t.dataset.i]&&R.items[+t.dataset.i].sets[+t.dataset.j];if(s){s[t.dataset.rf]=t.value;saveDraft();updDistPh('r',+t.dataset.i,+t.dataset.j,s);}}
}
document.addEventListener('input',onField);
document.addEventListener('change',function(e){if(e.target.tagName==='SELECT')onField(e);if(e.target.id==='st-import'&&e.target.files&&e.target.files[0]){readImport(e.target.files[0]);e.target.value='';}if(e.target.id==='cp-date'){S.cpDate=e.target.value||null;renderMain();}});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(ui.sheet)closeSheet();else if(ui.screen==='composer'){C=null;closeScreen();}else if(ui.screen==='hedit'){H=null;closeScreen();}});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  if(R&&ui.screen==='run')keepAwake();
  if(S.syncStarted&&S.sync.state!=='running'&&(!S.sync.at||Date.now()-S.sync.at>10*60000))syncPlanning();
});
window.addEventListener('online',function(){flushPending();});

/* Démarrage */
var now=new Date();
$('#top-date').textContent=J3[wdIdx(now)]+' '+now.getDate()+' '+MOIS[now.getMonth()];
try{S.recapOpen=localStorage.getItem('carnet-recap')!=='0';}catch(e){S.recapOpen=true;}
R=readDraft();
rebuildHist();
renderMain();
connect();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
